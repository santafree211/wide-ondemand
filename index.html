<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wide Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="title">⚡ wide Studio</div>
    <div class="badge badge-auth" id="auth-badge">認証済</div>
  </header>

  <!-- APIステータス警告バナー -->
  <div id="quota-warning-banner" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 6px; padding: 10px; margin-bottom: 12px;">
    <div style="font-weight: bold; color: #f87171; font-size: 12px; display: flex; align-items: center; gap: 6px;" id="quota-warning-title">
      ⚠️ Ubersuggest APIステータス通知
    </div>
    <div style="font-size: 11px; color: #fca5a5; margin-top: 4px; line-height: 1.4;" id="quota-warning-desc">
      APIの状態を監視しています。
    </div>
  </div>

  <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
    <span>シード＆前後2大固定軸 展開</span>
    <button id="btn-auto-gen" onclick="autoGenerateAxes()" style="background: #3b82f6; color: #fff; border: none; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; font-weight: bold;">
      ✨ AI自動展開・思考
    </button>
  </div>
  <div class="form-group">
    <label>シードキーワード (例: [A] [B])</label>
    <div style="display: flex; gap: 6px;">
      <input type="text" id="seed-input" value="" placeholder="キーワードを入力 (例: スター線 手相)" oninput="onSeedChanged(this.value)">
    </div>
  </div>

  <div class="axes-row">
    <div>
      <label id="axis1-label">軸①: [A] 〇〇 (前固定)</label>
      <textarea id="axis1-input" oninput="updateMeter()"></textarea>
    </div>
    <div>
      <label id="axis2-label">軸②: 〇〇 [B] (後固定)</label>
      <textarea id="axis2-input" oninput="updateMeter()"></textarea>
    </div>
  </div>

  <div class="meter-box">
    <div class="meter-head">
      <span id="meter-text">合計: 0 / 25件</span>
      <span id="meter-status" style="color: var(--warning);">判定中...</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="meter-fill"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;">
    <!-- Google実測SERP星判定ボタン (1日2,000枠活用・常時実行可能) -->
    <button class="btn-serp" id="btn-serp" onclick="executeSerpOnly()" style="width: 100%; padding: 10px; background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3); display: flex; align-items: center; justify-content: center; gap: 6px;">
      🔍 Google実測SERP星判定を実行 (公式2,000枠活用)
    </button>

    <!-- ★星付き精鋭キーワード蓄積プール（カウンター＆メーター） -->
    <div id="stock-pool-box" style="background: #0f172a; border: 1px solid #38bdf8; border-radius: 6px; padding: 10px; box-shadow: 0 4px 10px rgba(56, 189, 248, 0.1);">
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 4px;">
        <span style="font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 4px;">
          🌟 星付き精鋭キーワード自動蓄積プール
        </span>
        <span id="stock-pool-text" style="font-weight: bold; color: #facc15;">蓄積中: 0 / 500 件</span>
      </div>
      <div style="background: #1e293b; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 4px;">
        <div id="stock-pool-fill" style="background: linear-gradient(90deg, #38bdf8, #facc15); height: 100%; width: 0%; transition: width 0.3s ease;"></div>
      </div>
      <div style="font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between;">
        <span>重複排除済・Vol未取得: <strong id="stock-unmeasured-count" style="color: #38bdf8;">0</strong> 件</span>
        <span style="color: #a78bfa; font-weight: bold;">🤖 500件到達で自動メガバッチ実行</span>
      </div>
    </div>
  </div>

  <!-- リアルタイム進捗インジケーター -->
  <div id="live-progress-box" style="display: none; background: #1e293b; border: 1px solid #3b82f6; border-radius: 6px; padding: 10px; margin-top: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 6px;">
      <span style="font-weight: bold; color: #60a5fa;" id="live-prog-title">⚡ Ubersuggest & Google SERP リアルタイム実測中...</span>
      <span style="font-weight: bold; color: #34d399;" id="live-prog-pct">0%</span>
    </div>
    <div style="background: #0b1120; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 6px; position: relative;">
      <div id="live-prog-bar" style="background: linear-gradient(90deg, #3b82f6, #10b981); height: 100%; width: 5%; transition: width 0.3s ease;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8;">
      <span id="live-prog-kw">調査中: 接続中...</span>
      <span id="live-prog-count">0 / 0 件</span>
    </div>
  </div>

  <div class="results-box">
    <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
      <span id="results-count-title">最新リサーチ結果 (全件)</span>
      <div style="display: flex; gap: 6px; align-items: center;">
        <input type="file" id="csv-file-input" accept=".csv" style="display: none;" onchange="importCsv(event)">
        <button onclick="document.getElementById('csv-file-input').click()" style="background: #3b82f6; color: #fff; border: none; border-radius: 4px; padding: 3px 8px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;" title="過去に保存したSERP結果CSVを読み込みます">
          📥 CSV読込
        </button>
        <button onclick="exportToExcel()" style="background: #10b981; color: #fff; border: none; border-radius: 4px; padding: 3px 8px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;">
          📊 CSV出力
        </button>
        <span style="cursor: pointer; color: var(--primary);" onclick="loadResults()">🔄 更新</span>
      </div>
    </div>
    <table id="results-table">
      <thead>
        <tr><th>判定</th><th>キーワード</th><th>Vol</th><th>SD</th></tr>
      </thead>
      <tbody id="results-tbody">
        <tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 10px;">リサーチを実行するとここに結果が表示されます</td></tr>
      </tbody>
    </table>
  </div>

  <script src="ui_state_manager.js?v=20261029_02"></script>
  <script src="ui_research_api.js?v=20261029_02"></script>
  <script src="ui_results_table.js?v=20261029_02"></script>
  <script src="app.js?v=20261029_02"></script>
</body>
</html>
