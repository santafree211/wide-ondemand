<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wide Studio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; font-size: 13px; line-height: 1.4; }
    
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .title { font-weight: bold; font-size: 15px; color: #60a5fa; display: flex; align-items: center; gap: 6px; }
    .badge { padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: bold; }
    .badge-auth { background: #064e3b; color: #34d399; }
    
    .section-title { font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin: 10px 0 6px; letter-spacing: 0.5px; }
    
    /* テンプレカードグリッド */
    .presets-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .preset-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; cursor: pointer; transition: all 0.15s ease; }
    .preset-card:hover { border-color: var(--primary); transform: translateY(-1px); background: #243248; }
    .preset-title { font-weight: bold; color: #e2e8f0; font-size: 12px; display: flex; align-items: center; justify-content: space-between; }
    .preset-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    
    /* フォーム入力 */
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    input[type="text"] { width: 100%; background: #0b1120; border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; color: #fff; font-size: 12px; outline: none; }
    input[type="text"]:focus { border-color: var(--primary); }
    
    .axes-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    textarea { width: 100%; height: 110px; background: #0b1120; border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; color: #e2e8f0; font-size: 11px; font-family: monospace; resize: vertical; outline: none; }
    textarea:focus { border-color: var(--primary); }
    
    /* メーター＆実行ボタン */
    .meter-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; }
    .meter-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 6px; }
    .progress-bar-bg { background: #0b1120; height: 6px; border-radius: 3px; overflow: hidden; }
    .progress-bar-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.3s ease; }
    
    .btn-run { width: 100%; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 12px; font-weight: bold; font-size: 12px; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-run:hover { background: #1d4ed8; }
    .btn-run:disabled { background: #475569; cursor: not-allowed; }

    /* 結果プレビュー */
    .results-box { margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
    th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 10px; }
    td { padding: 4px 6px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
    .star-badge { color: #fbbf24; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="title">⚡ wide Studio</div>
    <div class="badge badge-auth" id="auth-badge">認証済</div>
  </header>

  <!-- APIステータス警告バナー -->
  <div id="quota-warning-banner" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 6px; padding: 10px; margin-bottom: 12px;">
    <div style="font-weight: bold; color: #f87171; font-size: 12px; display: flex; align-items: center; gap: 6px;" id="quota-warning-title">
      ⚠️ Ubersuggest APIステータス通知
    </div>
    <div style="font-size: 11px; color: #fca5a5; margin-top: 4px; line-height: 1.4;" id="quota-warning-desc">
      APIの状態を監視しています。
    </div>
  </div>

  <div class="section-title">wide化 黄金テンプレ設定</div>
  <div class="presets-grid" id="presets-container">
    <!-- テンプレカードが動的生成される -->
  </div>

  <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
    <span>シード＆前後2大固定軸 展開</span>
    <button id="btn-auto-gen" onclick="autoGenerateAxes()" style="background: #3b82f6; color: #fff; border: none; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; font-weight: bold;">
      ✨ AI自動展開・思考
    </button>
  </div>
  <div class="form-group">
    <label>シードキーワード (例: [A] [B])</label>
    <div style="display: flex; gap: 6px;">
      <input type="text" id="seed-input" value="ボールチェーン 100均" oninput="onSeedChanged(this.value)">
    </div>
  </div>

  <div class="axes-row">
    <div>
      <label id="axis1-label">軸①: [A] 〇〇 (前固定)</label>
      <textarea id="axis1-input" oninput="updateMeter()"></textarea>
    </div>
    <div>
      <label id="axis2-label">軸②: 〇〇 [B] (後固定)</label>
      <textarea id="axis2-input" oninput="updateMeter()"></textarea>
    </div>
  </div>

  <div class="meter-box">
    <div class="meter-head">
      <span id="meter-text">合計: 0 / 25件</span>
      <span id="meter-status" style="color: var(--warning);">判定中...</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="meter-fill"></div>
    </div>
  </div>

  <button class="btn-run" id="btn-run" onclick="executeBatch()">
    🚀 1-Shot メガバッチ実行 (API: 1回)
  </button>

  <!-- リアルタイム進捗インジケーター -->
  <div id="live-progress-box" style="display: none; background: #1e293b; border: 1px solid #3b82f6; border-radius: 6px; padding: 10px; margin-top: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 6px;">
      <span style="font-weight: bold; color: #60a5fa;" id="live-prog-title">⚡ Ubersuggest & Google SERP リアルタイム実測中...</span>
      <span style="font-weight: bold; color: #34d399;" id="live-prog-pct">0%</span>
    </div>
    <div style="background: #0b1120; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 6px; position: relative;">
      <div id="live-prog-bar" style="background: linear-gradient(90deg, #3b82f6, #10b981); height: 100%; width: 5%; transition: width 0.3s ease;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8;">
      <span id="live-prog-kw">調査中: 接続中...</span>
      <span id="live-prog-count">0 / 0 件</span>
    </div>
  </div>

  <div class="results-box">
    <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
      <span id="results-count-title">最新リサーチ結果 (全件)</span>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button onclick="exportToExcel()" style="background: #10b981; color: #fff; border: none; border-radius: 4px; padding: 3px 8px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;">
          📊 Excel出力 (.csv)
        </button>
        <span style="cursor: pointer; color: var(--primary);" onclick="loadResults()">🔄 更新</span>
      </div>
    </div>
    <table id="results-table">
      <thead>
        <tr><th>判定</th><th>キーワード</th><th>Vol</th><th>SD</th></tr>
      </thead>
      <tbody id="results-tbody">
        <tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 10px;">リサーチを実行するとここに結果が表示されます</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const presets = [
      {
        title: "⚡ 失敗・恐怖回避型",
        desc: "高額商品・発火事故の不安解消",
        seed: "ポータブル電源 買ってはいけないメーカー",
        axis1: ["おすすめ", "寿命", "発火事故", "危険性", "リン酸鉄リチウム", "処分方法", "コスパ最強", "日本製", "キャンプ 容量", "防災 必要な容量", "電子レンジ 使える"],
        axis2: ["モバイルバッテリー", "ソーラーパネル", "蓄電池", "ロボット掃除機", "冷蔵庫", "ドラム式洗濯機", "テレビ", "エアコン", "パソコン", "テント", "スマートウォッチ"]
      },
      {
        title: "🍃 デメリット・健康不安型",
        desc: "健康食品・害や太る悩みの解消",
        seed: "はちみつレモン 体に悪い",
        axis1: ["太る", "効果", "作り方", "カビ", "毎日", "賞味期限", "妊娠中", "保存容器", "白湯", "クエン酸", "効能"],
        axis2: ["レモン水", "リンゴ酢", "トマトジュース", "豆乳", "プロテイン", "炭酸水", "白湯", "お茶", "コーヒー", "緑茶", "青汁"]
      },
      {
        title: "📦 継続課金・サブスク型",
        desc: "月額サービス・レンタル比較",
        seed: "おもちゃ サブスク",
        axis1: ["知育", "レンタル", "買取", "収納", "人気", "年齢別", "片付け", "手作り", "消毒", "プレゼント", "赤ちゃん"],
        axis2: ["絵本", "洋服", "家具", "知育玩具", "花", "コーヒー", "お菓子", "家電", "音楽", "ゲーム", "服"]
      },
      {
        title: "🧠 コンプレックス・解決型",
        desc: "深いメンタル・能力の悩み",
        seed: "自己肯定感 低い",
        axis1: ["診断", "高める", "上げる", "特徴", "毒親", "原因", "チェック", "子供", "恋愛", "仕事", "トレーニング"],
        axis2: ["自己効力感", "自尊心", "コミュ力", "精神年齢", "語彙力", "集中力", "幸福度", "意欲", "感受性", "免疫力", "運動神経"]
      }
    ];

    function initPresets() {
      const container = document.getElementById("presets-container");
      container.innerHTML = "";
      presets.forEach((p, idx) => {
        const div = document.createElement("div");
        div.className = "preset-card";
        div.onclick = () => applyPreset(idx);
        div.innerHTML = `
          <div class="preset-title">${p.title} <span>→</span></div>
          <div class="preset-desc">${p.desc}</div>
        `;
        container.appendChild(div);
      });
    }

    function saveState() {
      const seed = document.getElementById("seed-input").value;
      const a1 = document.getElementById("axis1-input").value;
      const a2 = document.getElementById("axis2-input").value;
      const stateObj = { seed, a1, a2 };
      
      // 1. ローカルストレージに即時保存
      localStorage.setItem("wide_studio_seed", seed);
      localStorage.setItem("wide_studio_axis1", a1);
      localStorage.setItem("wide_studio_axis2", a2);

      // 2. サーバー側 state.json にも永続保存（ブラウザキャッシュクリアされても復元保証）
      fetch("/api/state", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(stateObj)
      }).catch(() => {});
    }

    async function loadSavedState() {
      // 1. サーバーの state.json から完全復元を試みる
      try {
        const res = await fetch(`/api/state?_t=${Date.now()}`);
        const state = await res.json();
        if (state && state.seed && state.seed.trim().length > 0) {
          document.getElementById("seed-input").value = state.seed;
          if (state.a1 !== undefined) document.getElementById("axis1-input").value = state.a1;
          if (state.a2 !== undefined) document.getElementById("axis2-input").value = state.a2;
          updateLabels(state.seed);
          updateMeter();
          return true;
        }
      } catch (e) {}

      // 2. フォールバック: ローカルストレージから復元
      const savedSeed = localStorage.getItem("wide_studio_seed");
      if (savedSeed !== null && savedSeed.trim().length > 0) {
        document.getElementById("seed-input").value = savedSeed;
        const savedA1 = localStorage.getItem("wide_studio_axis1");
        const savedA2 = localStorage.getItem("wide_studio_axis2");
        if (savedA1 !== null) document.getElementById("axis1-input").value = savedA1;
        if (savedA2 !== null) document.getElementById("axis2-input").value = savedA2;
        updateLabels(savedSeed);
        updateMeter();
        return true;
      }
      return false;
    }

    let seedDebounce = null;
    function onSeedChanged(val) {
      saveState();
      updateLabels(val);
      updateMeter();
      clearTimeout(seedDebounce);
      seedDebounce = setTimeout(() => {
        if (val.trim().length > 1) {
          autoGenerateAxes();
        }
      }, 600);
    }

    async function autoGenerateAxes() {
      const seed = document.getElementById("seed-input").value.trim();
      if (!seed) return;
      const genBtn = document.getElementById("btn-auto-gen");
      if (genBtn) {
        genBtn.innerText = "⏳ 思考中...";
        genBtn.disabled = true;
      }
      try {
        const res = await fetch(`/api/expand?seed=${encodeURIComponent(seed)}`);
        const data = await res.json();
        if (data.axis1 && data.axis1.length > 0) {
          document.getElementById("axis1-input").value = data.axis1.join("\n");
        }
        if (data.axis2 && data.axis2.length > 0) {
          document.getElementById("axis2-input").value = data.axis2.join("\n");
        }
        updateLabels(seed);
        updateMeter();
      } catch (e) {
        console.error("Expand error:", e);
      } finally {
        if (genBtn) {
          genBtn.innerText = "✨ AI自動展開・思考";
          genBtn.disabled = false;
        }
      }
    }

    function applyPreset(idx) {
      const p = presets[idx];
      document.getElementById("seed-input").value = p.seed;
      document.getElementById("axis1-input").value = p.axis1.join("\n");
      document.getElementById("axis2-input").value = p.axis2.join("\n");
      updateLabels(p.seed);
      updateMeter();
      saveState();
    }

    const KNOWN_SUFFIXES = [
      "100均", "ダイソー", "セリア", "キャンドゥ", "ワッツ",
      "おすすめ", "口コミ", "評判", "違い", "比較", "ランキング",
      "使い方", "作り方", "危険性", "デメリット", "メリット", "効果",
      "体に悪い", "買ってはいけないメーカー", "買ってはいけない", "太る", "痩せる",
      "低い", "高い", "サブスク", "レンタル", "知育", "売ってない", "どこで買える"
    ];

    function smartSplit(text) {
      const clean = text.trim();
      const parts = clean.split(/\s+/);
      if (parts.length >= 3) {
        return {
          is3words: true,
          a: parts[0] + " " + parts[1],
          b: parts[1] + " " + parts.slice(2).join(" "),
          slotA: parts[0],
          slotB: parts.slice(1).join(" ")
        };
      }
      if (parts.length === 2) {
        return { is3words: false, a: parts[0], b: parts[1] };
      }
      for (const s of KNOWN_SUFFIXES.sort((x, y) => y.length - x.length)) {
        if (clean.endsWith(s) && clean.length > s.length) {
          return { is3words: false, a: clean.slice(0, -s.length).trim(), b: s };
        }
      }
      return { is3words: false, a: clean, b: "" };
    }

    function updateLabels(seed) {
      const res = smartSplit(seed);
      if (res.is3words) {
        document.getElementById("axis1-label").innerText = `軸①: [${res.a}] 〇〇 (前固定)`;
        document.getElementById("axis2-label").innerText = `軸②: 〇〇 [${res.b}] (後固定)`;
      } else {
        document.getElementById("axis1-label").innerText = `軸①: [${res.a || "A"}] 〇〇 (前固定)`;
        document.getElementById("axis2-label").innerText = `軸②: 〇〇 [${res.b || "B"}] (後固定)`;
      }
    }

    function updateMeter() {
      saveState();
      const seed = document.getElementById("seed-input").value.trim();
      updateLabels(seed);
      const a1 = document.getElementById("axis1-input").value.split("\n").filter(x => x.trim().length > 0);
      const a2 = document.getElementById("axis2-input").value.split("\n").filter(x => x.trim().length > 0);

      const { a: slotA, b: slotB } = smartSplit(seed);

      const set = new Set();
      if (seed) set.add(seed);
      if (slotA) set.add(slotA);
      if (slotB) set.add(slotB);
      a1.forEach(t => {
        const cleanT = t.trim();
        if (cleanT.startsWith(slotA)) set.add(cleanT);
        else if (slotA) set.add(`${slotA} ${cleanT}`);
        else set.add(cleanT);
      });
      a2.forEach(t => {
        const cleanT = t.trim();
        if (cleanT.endsWith(slotB)) set.add(cleanT);
        else if (slotB) set.add(`${cleanT} ${slotB}`);
        else set.add(cleanT);
      });

      const count = set.size;
      const fill = document.getElementById("meter-fill");
      const text = document.getElementById("meter-text");
      const status = document.getElementById("meter-status");
      const btn = document.getElementById("btn-run");

      text.innerText = `合計: ${count} / 25件`;
      fill.style.width = Math.min((count / 25) * 100, 100) + "%";

      if (isQuotaExhausted) {
        fill.style.background = "#ef4444";
        status.innerText = "❌ API上限到達 (実行停止中)";
        status.style.color = "#ef4444";
        btn.disabled = true;
        btn.style.background = "#475569";
        btn.style.cursor = "not-allowed";
        btn.innerText = "🛑 API上限到達のため一時停止中";
        return;
      }

      if (count >= 25) {
        fill.style.background = "var(--success)";
        status.innerText = "✔ 閾値達成 (実行可能)";
        status.style.color = "var(--success)";
        btn.disabled = false;
        btn.style.background = "#2563eb";
        btn.style.cursor = "pointer";
        btn.innerText = "🚀 1-Shot メガバッチ実行 (API: 1回)";
      } else {
        fill.style.background = "var(--warning)";
        status.innerText = `あと ${25 - count} 件不足`;
        status.style.color = "var(--warning)";
        btn.disabled = true;
        btn.style.background = "#475569";
        btn.style.cursor = "not-allowed";
        btn.innerText = "🚀 1-Shot メガバッチ実行 (API: 1回)";
      }
    }

    let progressPollingTimer = null;

    function startProgressPolling() {
      const box = document.getElementById("live-progress-box");
      const btn = document.getElementById("btn-run");
      if (box) box.style.display = "block";
      if (btn) {
        btn.disabled = true;
        btn.innerText = "⚡ メガバッチ実測中...";
      }

      clearInterval(progressPollingTimer);
      progressPollingTimer = setInterval(async () => {
        try {
          const res = await fetch(`/api/progress?_t=${Date.now()}`);
          const data = await res.json();
          if (!data) return;

          const pctEl = document.getElementById("live-prog-pct");
          const barEl = document.getElementById("live-prog-bar");
          const kwEl = document.getElementById("live-prog-kw");
          const countEl = document.getElementById("live-prog-count");
          const titleEl = document.getElementById("live-prog-title");

          if (pctEl) pctEl.innerText = `${data.percent || 0}%`;
          if (barEl) barEl.style.width = `${data.percent || 0}%`;
          if (kwEl) kwEl.innerText = data.current_keyword ? `調査中: ${data.current_keyword}` : "準備中...";
          if (countEl) countEl.innerText = `${data.current || 0} / ${data.total || 0} 件`;

          // 途中経過もリアルタイムでテーブルに流し込む
          loadResults();

          if (data.status === "COMPLETED" || (data.total > 0 && data.current >= data.total)) {
            clearInterval(progressPollingTimer);
            if (titleEl) titleEl.innerText = "✔ メガバッチ実測調査完了！";
            if (pctEl) pctEl.innerText = "100%";
            if (barEl) barEl.style.width = "100%";
            if (btn) {
              btn.disabled = false;
              btn.innerText = "🚀 1-Shot メガバッチ実行 (API: 1回)";
            }
            setTimeout(() => {
              if (box) box.style.display = "none";
              if (titleEl) titleEl.innerText = "⚡ Ubersuggest & Google SERP リアルタイム実測中...";
            }, 6000);
          } else if (data.status === "ERROR") {
            clearInterval(progressPollingTimer);
            if (titleEl) titleEl.innerText = `❌ エラー: ${data.message || ""}`;
            if (btn) {
              btn.disabled = false;
              btn.innerText = "🚀 1-Shot メガバッチ実行 (API: 1回)";
            }
          }
        } catch (e) {
          console.error("Progress poll error:", e);
        }
      }, 1000);
    }

    async function executeBatch() {
      // 1. メガバッチが押された瞬間に前回の結果テーブルを即座にクリア
      const tbody = document.getElementById("results-tbody");
      const titleSpan = document.getElementById("results-count-title");
      if (titleSpan) titleSpan.innerText = "リサーチ実行中 (準備中...)";
      if (tbody) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #60a5fa; padding: 16px; font-weight: bold;">⚡ 新規リサーチを開始しました。実測が完了したキーワードから順次表示されます...</td></tr>`;
      }

      // 2. ボタンを押した瞬間に即座に進捗バーを表示する
      startProgressPolling();

      const seed = document.getElementById("seed-input").value.trim();
      const a1 = document.getElementById("axis1-input").value.split("\n").filter(x => x.trim());
      const a2 = document.getElementById("axis2-input").value.split("\n").filter(x => x.trim());

      try {
        const res = await fetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ seed, axis1: a1, axis2: a2 })
        });
        const data = await res.json();
      } catch (e) {
        alert("実行エラー: " + e);
        const btn = document.getElementById("btn-run");
        if (btn) {
          btn.disabled = false;
          btn.innerText = "🚀 1-Shot メガバッチ実行 (API: 1回)";
        }
      }
    }

    let currentResultsList = [];

    async function loadResults() {
      try {
        const seed = document.getElementById("seed-input") ? document.getElementById("seed-input").value.trim() : "";
        const url = seed ? `/api/results?seed=${encodeURIComponent(seed)}&_t=${Date.now()}` : `/api/results?_t=${Date.now()}`;
        const res = await fetch(url);
        const list = await res.json();
        currentResultsList = list || [];
        const tbody = document.getElementById("results-tbody");
        const titleSpan = document.getElementById("results-count-title");
        if (list && list.length > 0) {
          if (titleSpan) titleSpan.innerText = `最新リサーチ結果 (全 ${list.length} 件)`;
          tbody.innerHTML = list.map(row => `
            <tr>
              <td><span class="star-badge">${row.star_rating || "-"}</span></td>
              <td>${row.keyword}</td>
              <td>${row.volume != null ? row.volume.toLocaleString() : "N/A"}</td>
              <td>${row.sd != null ? row.sd : "N/A"}</td>
            </tr>
          `).join("");
        } else {
          if (titleSpan) titleSpan.innerText = `最新リサーチ結果 (0 件)`;
          tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 10px;">リサーチを実行するとここに結果が表示されます</td></tr>`;
        }
      } catch (e) {
        console.error("loadResults error:", e);
      }
    }

    function exportToExcel() {
      // 1. サーバー側エンドポイントへ直接リダイレクト/ダウンロード (現在のシードKWのみを出力)
      const seed = document.getElementById("seed-input") ? document.getElementById("seed-input").value.trim() : "";
      const url = seed ? `/api/export_csv?seed=${encodeURIComponent(seed)}&_t=${Date.now()}` : `/api/export_csv?_t=${Date.now()}`;
      window.location.href = url;
      
      // 2. 完了メッセージ表示
      setTimeout(() => {
        alert("📊 ダウンロードフォルダ（C:\\Users\\santa\\Downloads）にCSVを直接保存しました！\n（Excelでそのまま文字化けせず開けます）");
      }, 500);
    }

    let isQuotaExhausted = false;

    async function checkSystemStatus() {
      try {
        const res = await fetch(`/api/status?_t=${Date.now()}`);
        const data = await res.json();
        const banner = document.getElementById("quota-warning-banner");
        const bannerTitle = document.getElementById("quota-warning-title");
        const bannerDesc = document.getElementById("quota-warning-desc");
        const badge = document.getElementById("auth-badge");

        const apiStat = data.api_status || {};
        const statusCode = apiStat.code || 200;
        const statusType = apiStat.status || "OK";

        if (statusCode === 401) {
          // HTTP 401: トークン失効・再認証必要
          isQuotaExhausted = true;
          if (banner) banner.style.display = "block";
          if (bannerTitle) bannerTitle.innerText = "🔑 Ubersuggest 認証期限切れ (HTTP 401)";
          if (bannerDesc) bannerDesc.innerHTML = "OAuthアクセストークンの有効期限が切れたため、API接続が拒絶されました。<br>下のボタンから1クリックで再認証を行うと、以後は<strong>完全自動でトークン延命</strong>が継続します。<div style='margin-top:10px;'><a href='/oauth/login' target='_blank' style='display:inline-block;background:#0284c7;color:#fff;font-weight:bold;padding:8px 16px;border-radius:6px;text-decoration:none;font-size:13px;'>🔑 Ubersuggest再認証（ブラウザを開く）</a></div>";
          if (badge) {
            badge.innerText = "要再認証 (HTTP 401)";
            badge.style.background = "#7f1d1d";
            badge.style.color = "#fca5a5";
          }
        } else if (statusCode === 403 || data.quota_exhausted) {
          // HTTP 403: 日次100枠枯渇
          isQuotaExhausted = true;
          if (banner) banner.style.display = "block";
          if (bannerTitle) bannerTitle.innerText = "⚠️ Ubersuggest 日次レポート上限到達 (HTTP 403)";
          if (bannerDesc) bannerDesc.innerHTML = "本日分の日次レポート枠（100回/日）が枯渇したため、新規のVol/SD取得が一時停止されています。<br>日付変更（0時リセット）後に自動再開されます。";
          if (badge) {
            badge.innerText = "上限到達 (100/100)";
            badge.style.background = "#7f1d1d";
            badge.style.color = "#f87171";
          }
        } else if (statusCode === 429) {
          // HTTP 429: レート制限
          isQuotaExhausted = true;
          if (banner) banner.style.display = "block";
          if (bannerTitle) bannerTitle.innerText = "⏳ 一時的なアクセス過多 (HTTP 429: Rate Limited)";
          if (bannerDesc) bannerDesc.innerHTML = "短時間に連続アクセスがあったため制限されています。1分ほどお待ちいただくと自動解除されます。";
          if (badge) {
            badge.innerText = "レート制限中 (429)";
            badge.style.background = "#78350f";
            badge.style.color = "#fde68a";
          }
        } else {
          // 正常稼働
          isQuotaExhausted = false;
          if (banner) banner.style.display = "none";
          if (badge) {
            badge.innerText = "認証済 (OK)";
            badge.style.background = "#064e3b";
            badge.style.color = "#34d399";
          }
        }
        updateMeter();
      } catch (e) {
        console.error("Status check error:", e);
      }
    }

    // 初期化
    initPresets();
    if (!loadSavedState()) {
      applyPreset(0);
    }
    loadResults();
    checkSystemStatus();
    // 30秒ごとに上限状態を自動ポーリング確認
    setInterval(checkSystemStatus, 30000);
  </script>
</body>
</html>
